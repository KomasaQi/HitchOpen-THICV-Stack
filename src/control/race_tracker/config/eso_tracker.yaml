eso_tracker:  
  # --- 1. 基础配置 (维度与时间) ---
  nx: 6                           # 状态维度 [x, y, theta, vy, r, delta]
  nu: 1                           # 控制量维度 [delta_des]
  prediction_step: 35             # 预测步长 (N)
  sparse_control_step: 3          # 控制步长 (Nc)
  sampling_time: 0.05             # 采样时间 dt (s)
  integration_grade: 1.0          # 积分器: 1.0=Euler, 2.0=RK2, 4.0=RK4

  # --- 2. 车辆物理参数 ---
  # ---------固定结构参数---------
  m: 9400.0                       # 空车头/牵引车自身质量 (kg)，不随 EBS 整车质量变化
  L: 4.00                         # 牵引车轴距 (m)；每周期自动计算 lr = L - lf

  # ---------质量调度参数表---------
  # 说明：received_mass_ 位于相邻质量节点之间时做分段线性插值；
  #       小于首节点或大于末节点时，分别恒定取首端值或末端值。
  mass_interp_points: [9400.0, 16000.0, 33000.0, 49000.0]  # [空车头, 空载整车, 半载, 满载]

  # 当前压缩包只提供了原单点参数，未提供四工况标定值。
  # 为保证修改后默认行为不突变，以下数组暂时复制原值；请将每个数组替换为对应四工况标定结果。
  Iz_interp_points: [62200.0, 62200.0, 62200.0, 62200.0]           # kg·m²
  lf_interp_points: [1.67, 1.67, 1.67, 1.67]                       # m
  Cf_interp_points: [270000.0, 270000.0, 270000.0, 270000.0]      # N/rad
  Cr_interp_points: [1500000.0, 1500000.0, 1500000.0, 1500000.0] # N/rad

  # ---------挂车/等效惯量参数-----------
  lg: 3.40                        # 第五轮到挂车等效轴距离 (m)
  lh: 0.0                         # 铰接点相对牵引车质心的纵向偏移 (m)
  auto_update_total_weight: true  # true: 使用 vehicle_status->mass 更新 received_mass_ 和 m_total
  m_total: 16000.0                # 无有效 EBS 质量或关闭自动更新时的整车质量回退值 (kg)
  Kiz: 10.0                       # 单位挂车质量增加的挂车横摆转动惯量 (kg·m²/kg)
  use_equivalent_inertia: false   # 是否将挂车质量/惯量按铰接角折算进主车侧向模型

  # ---------转向参数-----------
  T_lag: 0.20                     # 转向系统滞后时间 (s)

  # --- 3. 控制量约束 ---
  min_steer: -0.5                 # 最小转向角 (rad)
  max_steer: 0.5                  # 最大转向角 (rad)
  steer_rate_min: 0.035           # 最大允许变化率曲线下限，高速段逼近值，rad/s
  steer_rate_max: 0.35            # 最大允许变化率曲线上限，低速段封顶值，rad/s
  steer_rate_v0_kmh: 15.0         # 反比例平滑项，值越大，中高速限制越严格
  steer_rate_k: 5.0               # 反比例强度，值越大，整体转角变化率越高

  use_lateral_error_steer_rate_boost: true   # 是否启用横向误差放宽转角变化率
  lateral_error_deadband: 0.20                # 横向误差死区，单位 m；小于该值不额外放宽
  lateral_error_full: 0.8                     # 横向误差达到该值时，放宽量达到最大
  lateral_error_rate_boost_max: 0.50          # 最大额外增加的转角变化率，单位 rad/s
  steer_rate_emergency_max: 0.85              # 误差大时最终允许的最大变化率，单位 rad/s
  lateral_error_filter_tau: 0.0               # 横向误差绝对值低通滤波时间常数，单位 s；0=关闭滤波

  # --- 4. 代价函数权重 (Q矩阵 & R矩阵) ---
  Q_x: 1.0                        # 位置X误差权重
  Q_y: 40.0                       # 位置Y误差权重 (原10000，略降以减少过度修正)
  Q_theta: 1034.0                 # 航向角误差权重
  Q_vy: 0.0                       # 侧向速度权重
  Q_r: 0.0                        # 横摆角速度权重 (原200，提高以增加横摆阻尼、抑制摆动)
  Q_delta: 0.0                    # 转向角权重
  R: 0.02                         # 控制量大小权重
  dR: 32000.0                     # 稀疏控制点增量权重 (平滑性)
  dR_dense: 0.0                   # 稠密增量权重(逐步)，抑制段内/段间阶梯抖动；0=关闭
  R_ddelta: 400.0                 # 转角二阶差分权重，专治来回摆动(蛇行)；0=关闭

  const_steer_bias: -0.0                    # 固定转向偏置 (rad)，可用于修正系统性转向误差
  use_slope_compensation: true              # 是否使用横坡补偿；false 时横坡补偿与 ay 零偏补偿均不参与 NMPC
  slope_compensation_coeff: -1.0            # 横坡补偿比例系数
  slope_compensation_filter_window_size: 5  # 横坡补偿加速度滤波窗口大小

  # --- 侧向加速度 ay 零偏补偿：只作用于横坡补偿计算 ay_slope=(ay_raw-ay_bias)-vx*r ---
  use_ay_bias_compensation: true        # ay 零偏补偿总开关；false=完全关闭静态/动态 ay 零偏补偿
  const_ay_bias: 0.0                    # 静态 ay 零偏；动态模式下也作为初值 (m/s²)
  use_dynamic_ay_compensation: true     # false=只使用 const_ay_bias；true=基于横向误差滑动窗口缓慢在线修正
  dynamic_ay_error_window_size: 200     # 横向误差窗口长度；20Hz*10s=200
  dynamic_ay_error_threshold: 0.02      # 窗口平均横向误差死区，单位 m；小于该值不更新
  dynamic_ay_bias_learning_rate: 0.0002 # 每周期每 1m 平均横向误差对应的 ay_bias 更新量，务必很小
  dynamic_ay_bias_max_step: 0.00005     # 单周期最大 ay_bias 更新量，防止过渡修正诱发蛇行
  dynamic_ay_bias_min: -0.5             # ay_bias 估计下限 (m/s²)
  dynamic_ay_bias_max: 0.5              # ay_bias 估计上限 (m/s²)
  dynamic_ay_require_full_window: true  # true=窗口填满后才允许动态更新
  dynamic_ay_bias_error_sign: -1.0      # 当前诊断：ay正偏->横误负，因此 err_mean<0 时增大偏置；若要“err_mean>0 增大偏置”，改为 +1.0



# ==============================================================================
#                        逻辑切换与纯跟踪配置
# ==============================================================================
supervisor_config:
  # --- 模式切换逻辑 ---
  startup_time: 0.1                     # 启动强制纯跟踪时间 (s)
  blend_speed_low: 4.1667   #4.1667     # 纯跟踪 -> 融合 切换车速 (15 km/h)
  blend_speed_high: 5  #5.0             # 融合 -> NMPC 切换车速 (18 km/h)
  
  # --- 纯跟踪 (Pure Pursuit) 参数 ---
  min_lookahead_distance: 10.0         # 前视距离 (m)
  lookahead_speed_coeff: 0.5           # 预瞄速度系数，默认0.7
  control_delay_sec: 0.0               # 纯跟踪时延迟系数
  control_time: 0.05                   # 控制频率20Hz
  output_lpf_tau: 0.00                 # 输出转角一阶低通时间常数(s)，0=关闭；0.08~0.15

  # --- 算法降级 ---
  degrade_failure_times: 3           # NMPC连续失败次数阈值，超过该值则降级为纯跟踪模式
  require_overtake_times: 10          # 连续要求超车次数阈值，超过该值则提示要求人工接管


#纵向
pid_controller:
  kp: 0.6
  ki: 0.05
  kd: 0.1
  max_throttle: 0.8
  max_brake: 0.8
  integral_limit: 2.0
  speed_tolerance: 0.2
  min_target_speed: 0.5
  predict_time_horizon: 0.5  # 预测时间 Horizon（s），默认0.5（用于将未来速度给到轨迹追踪，辅助克服控制时延）

