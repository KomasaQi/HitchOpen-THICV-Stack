eso_tracker:
  # --- 1. 基础配置 (维度与时间) ---
  nx: 6                           # 状态维度 [x, y, theta, vy, r, delta]
  nu: 1                           # 控制量维度 [delta_des]
  prediction_step: 35             # 预测步长 (N)
  sparse_control_step: 10         # V6前密后疏控制节点；不再把1.75s预测域仅分成3个长保持块
  near_dense_control_steps: 5     # 前5个预测周期逐拍控制，其余节点自动均分远端预测域
  sampling_time: 0.05             # 采样时间 dt (s)
  integration_grade: 4.0          # 积分器: 1.0=Euler, 2.0=RK2, 4.0=RK4；当前使用Euler降低耗时
  eso_disturbance_decay: 0.95     # 旧逐拍系数；仅在下面时间常数<=0时直接生效
  eso_disturbance_time_constant: 0.974786  # s；exp(-0.05/tau)=0.95，预测末端仍保留约16.6%
  curvature_smoothing_steps: 5    # 兼容旧日志；V6实际使用下面的固定空间窗口
  curvature_smoothing_distance_m: 6.0  # 固定6m空间割线曲率，同一位置不随车速改变平滑尺度

  # --- 本地诊断日志 ---
  enable_local_log: true
  local_log_directory: /tmp/eso_tracker_logs
  local_log_flush_interval: 100   # 每100行刷新一次，20Hz下约5s，降低控制线程I/O抖动

  # --- 2. 车辆物理参数 ---
  # ---------固定结构参数---------
  m: 25000.0                      # 空载仿真对应的牵引车模型质量 (kg)，不等同于m_total调度输入
  L: 4.135                        # 兼容旧配置；运行时由插值得到的 lf+lr 自动更新
  T_lag: 0.25                     # 恢复6月无高速蛇行基线的转向系统滞后 (s)

  # ---------质量调度参数表---------
  # 说明：received_mass_ 位于相邻质量节点之间时做分段线性插值；
  #       小于首节点或大于末节点时，分别恒定取首端值或末端值。
  mass_interp_points: [10000.0, 16000.0, 33000.0, 49000.0] # [仿真空载, 实车空载, 半载, 满载]

  # 10000kg节点恢复6月无高速蛇行模型；其余节点保留8月已有值，后续仍需用实车标定替换占位值。
  Iz_interp_points: [50000.0, 62200.0, 62200.0, 62200.0]            # kg·m²
  lf_interp_points: [2.00, 1.67, 1.67, 2.00]                        # m
  lr_interp_points: [2.135, 2.33, 2.33, 2.00]                       # m
  Cf_interp_points: [270000.0, 270000.0, 270000.0, 270000.0]        # N/rad
  Cr_interp_points: [1500000.0, 1500000.0, 1500000.0, 1500000.0]    # N/rad

  # ---------质量调度输入-----------
  auto_update_total_weight: true  # true: 使用 vehicle_status->mass 作为质量插值输入
  m_total: 10000.0                # 当前空载仿真回退值；仅作为插值自变量，不会覆盖固定模型质量m

  # --- 3. 转角幅值约束 ---
  min_steer: -1.0                 # 最小转向角 (rad)
  max_steer: 1.0                  # 最大转向角 (rad)
  max_steer_rate: 1            # NMPC内部前轮转角指令硬速率约束 (rad/s)

  # --- 4. 代价函数权重 (Q矩阵 & R矩阵) ---
  Q_x: 1.0                        # 位置X误差权重
  Q_y: 50.0                       # 单变量数据中跟踪改善最稳定，方向盘峰值低于 dR=24000 组
  Q_theta: 1034                # 航向角误差权重
  Q_vy: 0.0                       # 侧向速度权重
  Q_r: 50.0                       # 仅对经5步空间平滑的横摆率参考施加小权重s
  Q_delta: 0.0                    # 转向角权重
  R: 0.02                         # 控制量大小权重
  dR: 32000.0                      # 稀疏控制点增量权重 (平滑性)

  # --- V6稳态前馈与路径投影 ---
  use_equilibrium_feedforward: true   # 按当前全域vx、曲率及单轨参数求稳态delta_ff/vy_eq
  equilibrium_feedforward_gain: 1.0
  equilibrium_feedforward_limit: 1 # rad；最终仍受min/max_steer约束
  path_projection_heading_weight_m2: 4.0
  path_projection_heading_gate_rad: 1.2
  path_projection_rear_gate_m: 5.0

  const_steer_bias: -0.0                    # 固定转向偏置 (rad)，可用于修正系统性转向误差

  use_slope_compensation: true              # 是否使用横坡补偿；false 时横坡补偿与 ay 零偏补偿均不参与 NMPC
  slope_compensation_coeff: -1.0            # 横坡补偿比例系数
  slope_compensation_filter_tau: 1.0        # 一阶低通(s)；保留准静态横坡，抑制0.3~0.7Hz横向瞬态
  slope_estimator_mode: legacy_quasistatic  # 默认保留实车验证的 ay-vx*r 符号；选 tire_force_residual 时需另行验证 coeff=+1
  slope_dynamic_gate_enabled: true          # 转向/横摆快变时冻结横坡低频状态，不清零已有补偿
  slope_gate_max_yaw_accel: 0.15            # rad/s²
  slope_gate_max_steer_rate: 0.08           # rad/s
  slope_compensation_limit: 0.8             # m/s²，仅限制估计器输入，不改变小横坡增益

  # UKF 使用与 NMPC 一致的横坡扰动和 ay 零偏，避免把同一低频残差重复吸收为 vy。
  ukf_use_slope_disturbance: true
  ukf_q_vy: 0.01
  ukf_q_r: 0.001
  ukf_r_ay: 0.5
  ukf_r_r: 0.1
  ukf_ay_innovation_limit: 0.8              # m/s²；只限 ay 创新，横摆率创新不限
  ukf_vy_abs_max: 3.0                       # m/s；数值安全限幅
  observer_dynamic_min_speed_mps: 4.0       # 低于此速度锚定vy/r，避免动态模型低速漂移后冷启动

  # --- 侧向加速度 ay 零偏补偿：只作用于横坡补偿计算 ay_slope=(ay_raw-ay_bias)-vx*r ---
  use_ay_bias_compensation: true        # ay 零偏补偿总开关；false=完全关闭静态/动态 ay 零偏补偿
  const_ay_bias: 0.0                    # 静态 ay 零偏；动态模式下也作为初值 (m/s²)
  use_dynamic_ay_compensation: true     # false=只使用 const_ay_bias；true=基于横向误差滑动窗口缓慢在线修正
  dynamic_ay_error_window_size: 200     # 横向误差窗口长度；20Hz*10s=200
  dynamic_ay_error_threshold: 0.02      # 窗口平均横向误差死区，单位 m；小于该值不更新
  dynamic_ay_bias_learning_rate: 0.0002 # 每周期每 1m 平均横向误差对应的 ay_bias 更新量，务必很小
  dynamic_ay_bias_max_step: 0.00005     # 单周期最大 ay_bias 更新量，防止过渡修正诱发蛇行
  dynamic_ay_bias_min: -0.5             # ay_bias 估计下限 (m/s²)
  dynamic_ay_bias_max: 0.5              # ay_bias 估计上限 (m/s²)
  dynamic_ay_require_full_window: true  # true=窗口填满后才允许动态更新
  dynamic_ay_bias_error_sign: -1.0      # 当前诊断：ay正偏->横误负，因此 err_mean<0 时增大偏置；若要“err_mean>0 增大偏置”，改为 +1.0

# ==============================================================================
#                        逻辑切换与纯跟踪配置
# ==============================================================================
supervisor_config:
  # --- 模式切换逻辑 ---
  startup_time: 0.1                     # 启动强制纯跟踪时间 (s)
  blend_speed_low: 4.1667   #4.1667     # 纯跟踪 -> 融合 切换车速 (15 km/h)
  blend_speed_high: 5  #5.0             # 融合 -> NMPC 切换车速 (18 km/h)

  # --- 纯跟踪 (Pure Pursuit) 参数 ---
  min_lookahead_distance: 5.0         # 前视距离 (m)
  lookahead_speed_coeff: 0.5           # 预瞄速度系数 (s)
  # Ld=max(Ld_min, Ld_min+kv*vx-k_curvature*|kappa_preview|max)
  # 系数单位 m²；正值会在预瞄到大曲率时缩短前视距离，0=关闭曲率修正、保持原行为。
  lookahead_curvature_coeff: 0.0
  control_delay_sec: 0.0               # 纯跟踪时延迟系数z
  control_time: 0.05                   # 控制频率20Hz
  output_lpf_tau: 0.00                 # 输出转角一阶低通时间常数(s)，0=关闭；0.08~0.15

  # --- 算法降级 ---
  degrade_failure_times: 3           # NMPC连续失败次数阈值，超过该值则降级为纯跟踪模式
  require_overtake_times: 10          # 连续要求超车次数阈值，超过该值则提示要求人工接管

#纵向
pid_controller:
  kp: 0.6
  ki: 0.05
  kd: 0.1
  max_throttle: 0.8
  max_brake: 0.8
  integral_limit: 2.0
  speed_tolerance: 0.2
  min_target_speed: 0.5
  predict_time_horizon: 0.5  # 预测时间 Horizon（s），默认0.5（用于将未来速度给到轨迹追踪，辅助克服控制时延）
