eso_tracker:  
  # --- 1. 基础配置 (维度与时间) ---
  nx: 6                         # 状态维度 [x, y, theta, vy, r, delta]
  nu: 1                         # 控制量维度 [delta_des]
  prediction_step: 25           # 预测步长 (N)
  sparse_control_step: 3        # 控制步长 (Nc)
  sampling_time: 0.05           # 采样时间 dt (s)
  integration_grade: 1.0        # 积分器: 1.0=Euler, 2.0=RK2, 4.0=RK4

  # --- 2. 车辆物理参数 ---
  m: 10000.0                    # 车辆质量 (kg)
  Iz: 50000.0                   # 横摆转动惯量 (kg·m²)
  lf: 2.0                       # 质心到前轴距离 (m)
  lr: 2.135                     # 质心到后轴距离 (m)
  T_lag: 0.2                    # 转向系统滞后时间 (s)
  
  # --- 3. 轮胎模型参数 (RLS辨识初始值 & 上下限) ---
  Cf: 270000.0                  # 前轴侧偏刚度初始值 (N/rad)
  Cr: 1200000.0                 # 后轴侧偏刚度初始值 (N/rad)
  Cf_min: 270000.0              # RLS辨识下限
  Cf_max: 270000.0              # RLS辨识上限 (1e7)
  Cr_min: 1200000.0             # RLS辨识下限
  Cr_max: 1200000.0             # RLS辨识上限 (5e7)

  # --- 4. 控制量约束 ---
  min_steer: -0.5               # 最小转向角 (rad)
  max_steer: 0.5                # 最大转向角 (rad)

  # --- 5. 代价函数权重 (Q矩阵 & R矩阵) ---
  # 调参思路：抑制 ~5s 周期的方向盘“蛇行”(limit cycle)，同时尽量保持跟踪精度。
  # 关键点：(1) 适当提高对横摆率 r 的镇定权重(Q_r)，给系统更多阻尼；
  #        (2) 用新增的 R_ddelta / dR_dense 直接压制转角来回摆动；
  #        (3) Q_y 略降，避免为压位置误差而频繁动方向盘。
  Q_x: 1.0                       # 位置X误差权重
  Q_y: 10000.0                    # 位置Y误差权重 (原10000，略降以减少过度修正)
  Q_theta: 4000.0                # 航向角误差权重
  Q_vy: 1.0                      # 侧向速度权重
  Q_r: 200.0                     # 横摆角速度权重 (原200，提高以增加横摆阻尼、抑制摆动)
  Q_delta: 0.0                   # 转向角权重
  R: 20.0                      # 控制量大小权重
  dR: 2000000.0                  # 稀疏控制点增量权重 (平滑性)
  dR_dense: 300000.0             # 稠密增量权重(逐步)，抑制段内/段间阶梯抖动；0=关闭
  R_ddelta: 1800.0             # 转角二阶差分权重，专治来回摆动(蛇行)；0=关闭

# ==============================================================================
#                        逻辑切换与纯跟踪配置
# ==============================================================================
supervisor_config:
  # --- 模式切换逻辑 ---
  startup_time: 5.0              # 启动强制纯跟踪时间 (s)
  blend_speed_low: 4.1667   #4.1667        # 纯跟踪 -> 融合 切换车速 (15 km/h)
  blend_speed_high: 5  #5.0           # 融合 -> NMPC 切换车速 (18 km/h)
  
  # --- 纯跟踪 (Pure Pursuit) 参数 ---
  min_lookahead_distance: 6.0        # 前视距离 (m)
  lookahead_speed_coeff: 0.7          # 预瞄速度系数，默认0.7
  control_delay_sec: 0.2             # 纯跟踪时延迟系数
  control_time: 0.05                   # 控制频率20Hz
  output_lpf_tau: 0.10               # 输出转角一阶低通时间常数(s)，0=关闭；0.08~0.15 可顺滑手感

#纵向
pid_controller:
  kp: 0.6
  ki: 0.05
  kd: 0.1
  max_throttle: 0.8
  max_brake: 0.8
  integral_limit: 2.0
  speed_tolerance: 0.2
  min_target_speed: 0.5
  predict_time_horizon: 0.5  # 预测时间 Horizon（s），默认0.5（用于将未来速度给到轨迹追踪，辅助克服控制时延）