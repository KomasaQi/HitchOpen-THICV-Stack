# ESOTracker2：三自由度牵引车-挂车 NMPC + CKF 联合状态估计
eso_tracker2:
  # --- 1. 状态、预测域与积分器 ---
  nx: 8                           # [x,y,theta,vy,r,delta,r_t,gamma]
  nu: 1                           # 前轮目标转角
  prediction_step: 25             # 8维模型较重，先保留2版预测长度
  sparse_control_step: 8          # 前密后疏控制节点
  near_dense_control_steps: 4     # 前4拍逐拍控制，其余自动均分
  sampling_time: 0.05
  integration_grade: 2.0          # 1=Euler, 2=RK2, 4=RK4
  eso_disturbance_decay: 0.95
  eso_disturbance_time_constant: 0.974786

  # --- 2. 牵引车与挂车参数 ---
  m: 10000.0                      # 牵引车质量 kg
  Iz: 50000.0                     # 牵引车横摆惯量 kg*m^2
  lf: 2.0
  lr: 2.135
  m_t_empty: 7570.0               # 空挂车质量 kg
  Iz_t_empty: 150000.0            # 空挂车横摆惯量 kg*m^2
  m_t_total: 29500.0              # 挂车+载荷质量；不含牵引车
  lt: 3.4                         # 挂车质心到铰接点
  L2: 7.9                         # 铰接点到挂车轴
  lh: 0.0                         # 铰接点相对牵引车质心纵向偏移
  T_lag: 0.25
  Kiz: 10.0                       # 挂车载荷惯量增量系数 kg*m^2/kg

  # --- 3. 转角及实时性安全层 ---
  min_steer: -1.0 
  max_steer: 1.0
  delta_rate_max: 0.5            # 正向前轮转角速率 rad/s
  delta_rate_min: -0.5           # 负向前轮转角速率 rad/s
  nmpc_solve_deadline_ms: 50.0
  nmpc_ipopt_cpu_time_limit_ms: 45.0
  enforce_final_output_rate_limit: true
  publish_steering_angle_velocity: true
  steering_angle_velocity_cmd_radps: 0.35

  # --- 4. NMPC代价 ---
  Q_x: 1.0
  Q_y: 10000.0
  Q_theta: 104000.0
  Q_vy: 1.0
  Q_r: 200.0
  Q_delta: 1.0
  Q_r_t: 300.0                    # 已启用：跟踪挂车稳态横摆率
  Q_gamma: 500.0                  # 已启用：跟踪稳态铰接角
  Q_dgamma: 1000.0                # 已启用：抑制 r_t-r
  Q_R: 20.0                       # 仅惩罚前馈之外的反馈修正量
  Q_dR: 4000000.0                 # 惩罚实际物理转角命令增量

  # --- 5. 路径几何与稳态前馈 ---
  curvature_smoothing_distance_m: 6.0
  use_geometric_path_heading: true
  geometric_heading_window_m: 2.0
  path_projection_heading_weight_m2: 4.0
  path_projection_heading_gate_rad: 1.2
  path_projection_rear_gate_m: 5.0
  use_equilibrium_feedforward: true
  equilibrium_feedforward_gain: 1.0
  equilibrium_feedforward_limit: 0.45

  # --- 6. CKF/FF-RLS参数 ---
  observer_dynamic_min_speed_mps: 4.0
  rls_Cf_est: 270000.0
  rls_Cr_est: 1500000.0
  rls_Ct_est: 500000.0
  rls_w1_prev: 0.0
  rls_w1_dot_prev: 0.0
  rls_Cf_est_min: 270000.0
  rls_Cr_est_min: 1200000.0
  rls_Ct_est_min: 400000.0
  rls_Cf_est_max: 270000.0
  rls_Cr_est_max: 2000000.0
  rls_Ct_est_max: 1000000.0

  # --- 7. IPOPT ---
  ipopt_max_iter: 50
  ipopt_acceptable_tol: 5.0e-2
  ipopt_acceptable_iter: 3
  ipopt_warm_start_bound_push: 1.0e-3
  ipopt_warm_start_slack_bound_push: 1.0e-3
  ipopt_warm_start_mult_bound_push: 1.0e-3

# 与 ESOTracker 对齐的切换、PP和fallback监督逻辑
supervisor_config:
  startup_time: 0.1
  blend_speed_low: 4.1667
  blend_speed_high: 5.0
  standstill_speed: 0.05
  nmpc_speed_floor: 1.0

  min_lookahead_distance: 5.0
  lookahead_speed_coeff: 0.5
  lookahead_curvature_coeff: 0.0
  control_time: 0.05
  control_delay_sec: 0.0
  output_lpf_tau: 0.0

  degrade_failure_times: 3
  require_overtake_times: 10
  fallback_min_hold_s: 0.5
  fallback_required_successes: 8
  fallback_reentry_blend_time_s: 0.5
  fallback_reentry_max_lateral_error_m: 0.60
  fallback_reentry_max_heading_error_rad: 0.15
  fallback_reentry_max_yaw_rate_radps: 0.25
  fallback_reentry_max_kappa_step_1pm: 0.003
  fallback_reentry_max_nearest_index_jump: 5
  nmpc_attempt_min_speed_mps: 3.0

  startup_recovery_enabled: true
  startup_recovery_entry_lateral_error_m: 1.0
  startup_recovery_entry_heading_error_rad: 0.25
  startup_recovery_exit_lateral_error_m: 0.35
  startup_recovery_exit_heading_error_rad: 0.10
  startup_recovery_exit_yaw_rate_radps: 0.15
  startup_recovery_exit_cycles: 10
  startup_recovery_min_lookahead_m: 12.0
  startup_recovery_lookahead_error_gain: 2.0
  startup_recovery_max_steer_rad: 0.25
  startup_recovery_stationary_hold_speed_mps: 0.50

  infer_manual_mode_from_zero_tracking_error: true
  use_driving_mode_topic: true
  driving_mode_topic: /dfcv_bridge/driving_mode
  autonomous_driving_mode_value: 2
  driving_mode_timeout_s: 0.5
  manual_mode_zero_error_epsilon_m: 1.0e-9
  manual_mode_confirm_cycles: 3
  autonomous_mode_confirm_cycles: 2

# 纵向控制保持原配置
pid_controller:
  kp: 0.6
  ki: 0.05
  kd: 0.1
  max_throttle: 0.8
  max_brake: 0.8
  integral_limit: 2.0
  speed_tolerance: 0.2
  min_target_speed: 0.5
  predict_time_horizon: 0.5
