pid_controller:
  kp: 0.6
  ki: 0.05
  kd: 0.1
  max_throttle: 0.8
  max_brake: 0.8
  integral_limit: 2.0
  speed_tolerance: 0.2
  min_target_speed: 0.5
  predict_time_horizon: 0.5


human_like_adaptive_tracker:
  # V0.14 = 相位一致连续滑模 + 纯时延/一阶执行器/速度响应补偿
  #
  # 滑模面、边界层、到达项、积分限幅和随速收敛距离都由
  # wheelbase / allowed_lateral_error / 转角物理上限自动生成，
  # 不提供一长串需要实车遍历的滑模增益。

  # 车辆与前轮转角物理约束。
  wheelbase: 4.135
  max_steering_angle: 0.40
  max_steering_rate: 0.60
  max_steering_acceleration: 2.50

  # 同时决定滑模边界层的自动尺度。
  allowed_lateral_error: 0.10

  # 只需粗略给出三个动态先验：
  # gain = 前轮指令曲率到实测横摆曲率的稳态比例；
  # delay = 指令到车辆开始响应的纯时延；
  # actuator_time_constant = 执行器一阶时间常数。
  prior_response_gain: 0.50
  prior_delay: 0.01
  actuator_time_constant: 0.25

  # 车速10m/s时，转向执行器之后的车辆横向响应时间常数。
  # 代码按 tau_lat(v)=tau_lat_10*10/max(v,5) 自动随车速缩短，
  # 并限制在[0.08, 0.45]s。
  lateral_response_time_at_10ms: 0.22

  # 下列旧支路即使被旧launch设为true，V0.14仍会强制关闭。
  enable_predictive_control: false
  enable_shadow_learning: false
  enable_certified_learning_residual: false

  enable_debug_log: true
  debug_log_period: 0.50

  # 节点每次启动自动覆盖；停止节点后直接复制该文件。
  enable_csv_log: true
  csv_log_path: /tmp/human_like_adaptive_tracker_v14.csv
  csv_log_period: 0.10
