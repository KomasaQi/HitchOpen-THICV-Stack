# ==============================================================================
# race_lane_detection 参数配置
# 路径：$(find race_lane_detection)/config/params.yaml
# 坐标系：自车 FLU (x前 y左 z上)
# ==============================================================================

# -------------------------- 话题配置 --------------------------
image_topic: "/carla/ego_vehicle/rgb_front/image"          # 前视RGB图像(CARLA为bgra8)
camera_info_topic: "/carla/ego_vehicle/rgb_front/camera_info"  # 相机内参
lane_topic: "/race/lane_detection"                          # 结构化检测结果(race_msgs/LaneDetection)
ego_center_path_topic: "/race/lane_center_path"            # 自车道中心线轨迹(race_msgs/Path)
vis_image_topic: "/race/lane_vis_image"                     # 叠加可视化图像
markers_topic: "/race/lane_markers"                         # RViz车道线标记
ego_frame_id: "ego_vehicle"                                 # 自车坐标系名称

# -------------------------- 相机外参 --------------------------
# 安装于自车系 (3.5, 0, 3.0)，朝向前方，pitch=roll=yaw=0
cam_x: 3.5
cam_y: 0.0
cam_z: 5.0
cam_roll: 0.0
cam_pitch: 0.5236
cam_yaw: 0.0
cam_fov_deg: 90.0          # 仅在收不到 camera_info 时按此 fov 兜底计算内参
# 地面在自车系中的 z 高度(米)。若自车原点在地面则为0；若原点在某高度则填负值。
ground_z: 0.0

# -------------------------- 多项式拟合 --------------------------
fit_order: 3               # 默认拟合阶数(3)
max_fit_order: 5           # 允许的最大阶数(5)
report_order: 5            # 系数数组按此阶数补零输出(默认5阶=6个系数)
coeff_decimals: 6          # 系数保留小数位(默认6位)
lane_width: 3.75            # 标称车道宽度(米)，用于车道基检测与中心线推断

# -------------------------- 后端选择 --------------------------
# learning: 仅用学习后端(UFLDv2 onnx); classic: 仅用规则后端;
# auto: 学习后端可用则优先, 否则自动回退规则后端
detector_backend: "auto"

# 学习后端(UFLDv2 ONNX)配置
# 下载权重: rosrun race_lane_detection download_weights.py
# 留空则学习后端不可用(auto会回退到classic)
#
# 推荐: 相机设为 1600x800(2:1) 时用 CurveLanes res34 (800x1600, 10车道, 弯道更稳)
#   onnx_path: "<pkg>/weights/ufldv2_curvelanes_res34_800x1600.onnx"
# 或 CULane res34 (320x1600, 4车道, 直道城市道路):
#   onnx_path: "<pkg>/weights/ufldv2_culane_res34_320x1600.onnx"
onnx_path: ""
use_gpu: true              # onnxruntime 优先用 CUDA, 不可用则自动 CPU

# 数据集类型: auto(按输出形状自动判别) | culane | curvelanes
ufld_dataset: "auto"
# 顶部裁剪比例(送入网络前裁掉顶部天空). 留空用数据集默认
# (culane=0.6, curvelanes=0.8). CARLA相机pitch=0、地平线居中时, 若检测点
# 偏高/偏低可微调此值: 调小则保留更多顶部(更远处), 调大则更聚焦近处。
ufld_crop_ratio: 0.01
ufld_local_window: 64      # 局部soft-argmax窗口(grid数), 越大越平滑
ufld_min_lane_pts: 6       # 单条车道最少有效点数, 低于则丢弃

# -------------------------- 运行参数 --------------------------
process_rate: 15.0         # 检测处理频率(Hz)
publish_vis_image: true    # 是否发布叠加可视化图像
publish_markers: true      # 是否发布 RViz MarkerArray
